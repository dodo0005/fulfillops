# Every NON-secret variable from section 3 of the team guide.
# DATABASE_URL lives in Secret fulfillops-db (created by scripts/create-secret.sh, never in Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulfillops-config
data:
  APP_ENV: lab
  REDIS_URL: redis://fulfillops-redis:6379/0
  QUEUE_BACKEND: postgres
  API_PORT: "8080"
  MAX_BODY_BYTES: "16384"
  LOG_LEVEL: INFO
  WORKER_MAX_ATTEMPTS: "5"
  WORKER_LEASE_SECONDS: "20"
  WORKER_POLL_INTERVAL_SECONDS: "2"
  WORKER_PROCESSING_DELAY_SECONDS: "0.5"
  WORKER_BACKOFF_BASE_SECONDS: "1"
  WORKER_BACKOFF_MAX_SECONDS: "30"
  WORKER_METRICS_PORT: "9100"
  POISON_TEST_MODE: "false"
