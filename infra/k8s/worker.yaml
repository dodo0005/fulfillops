apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-worker
  labels:
    app.kubernetes.io/name: fulfillops-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-worker
    spec:
      serviceAccountName: fulfillops
      automountServiceAccountToken: false
      # SIGTERM -> worker finishes its current job (< lease) and exits.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fulfillops
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "worker.main"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: WORKER_ID            # pod name, via the downward API
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
