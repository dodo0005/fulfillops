apiVersion: v1
kind: Service
metadata:
  name: fulfillops-postgres
  labels:
    app.kubernetes.io/name: fulfillops-postgres
spec:
  selector:
    app.kubernetes.io/name: fulfillops-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fulfillops-postgres
  labels:
    app.kubernetes.io/name: fulfillops-postgres
  annotations:
    # Argo CD must never prune the database, even if it disappears from Git.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  serviceName: fulfillops-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-postgres
    spec:
      serviceAccountName: fulfillops
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fulfillops
            - name: POSTGRES_DB
              value: fulfillops
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fulfillops", "-d", "fulfillops"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fulfillops", "-d", "fulfillops"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data          # PVC name becomes data-fulfillops-postgres-0
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
