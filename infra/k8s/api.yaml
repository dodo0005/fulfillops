apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api
  labels:
    app.kubernetes.io/name: fulfillops-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fulfillops-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080     # kind maps this to localhost:8080 (infra/kind-config.yaml)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-api
  labels:
    app.kubernetes.io/name: fulfillops-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5            # a new pod must stay Ready 5 s before it counts
  progressDeadlineSeconds: 90   # broken rollout -> ProgressDeadlineExceeded after 90 s
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # add one new pod at a time
      maxUnavailable: 0  # never remove an old pod before a new one is Ready
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-api
  template:
    metadata:
      annotations:
        fulfillops/release: "5"
      labels:
        app.kubernetes.io/name: fulfillops-api
    spec:
      serviceAccountName: fulfillops
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Safe with 2 replicas: common.migrate holds a Postgres advisory lock.
        - name: migrate
          image: fulfillops
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "common.migrate"]
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: fulfillops
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Give the Service time to drop this pod from its endpoints before SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
