# FulfillOps PR pipeline. Job names = required status checks on main.
# Every action is pinned to a full commit SHA (version in the comment); see docs/supply-chain.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; only `publish` gets packages: write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash  # runs with -eo pipefail, so `cmd | tee` still fails on cmd's error

env:
  UV_VERSION: "0.13.5"
  TRIVY_VERSION: "v0.76.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -v --junitxml=reports/unit.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore

  integration-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FULFILLOPS_BASE_URL: http://localhost:8080
      FULFILLOPS_URLS: http://localhost:8080,http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: Start a fresh, isolated test stack
        run: |
          mkdir -p reports
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
      - name: Integration and race tests
        run: |
          paths=""
          for d in tests/integration tests/race; do [ -d "$d" ] && paths="$paths $d"; done
          if [ -z "$paths" ]; then
            echo "::warning::no tests/integration or tests/race yet"
          else
            uv run pytest $paths -v --junitxml=reports/integration.xml
          fi
      - name: Reset test data (tests above consume stock)
        run: |
          if [ -f common/reset_test_data.py ]; then
            ./scripts/reset-test-data.sh
          else
            echo "::warning::common/reset_test_data.py not merged yet; checker runs on whatever stock is left"
          fi
      - name: Public checker --concurrency --stress (must be 0 failed, 0 skipped)
        run: |
          python3 tests/contract/fulfillops_public_checker.py \
            --base-url "$FULFILLOPS_BASE_URL" --concurrency --stress | tee reports/checker.txt
          grep -q '/ 0 failed / 0 skipped' reports/checker.txt
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > reports/compose-logs.txt || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-and-contract-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore
      - name: Tear down (CI only, volume removed)
        if: always()
        run: docker compose down -v

  build-scan-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (GHCR needs a lowercase owner)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fulfillops" >> "$GITHUB_ENV"
          mkdir -p reports
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image tagged with the full commit SHA
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — BLOCKING (CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: reports/trivy-blocking.txt
      - name: Show blocking findings
        if: always()
        run: cat reports/trivy-blocking.txt 2>/dev/null || true
      - name: Trivy — INFORMATIONAL (all severities, never fails)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: reports/trivy-all.json
      - name: Syft SBOM (CycloneDX JSON)
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: reports/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ github.sha }}
          path: |
            reports/trivy-blocking.txt
            reports/trivy-all.json
          if-no-files-found: ignore
      # On main only: hand the exact scanned image to `publish` (no rebuild).
      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:${{ github.sha }}" -o image.tar
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}
          path: image.tar
          retention-days: 3

  # Gated promotion: runs only on main and only if every check above is green.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit-tests, integration-and-contract, build-scan-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.sha }}
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fulfillops" >> "$GITHUB_ENV"
          docker load -i image.tar
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable SHA tag and record the digest
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          {
            echo "### Published image"
            echo "- tag: \`$IMAGE:${{ github.sha }}\`"
            echo "- digest: \`$digest\`"
            echo
            echo "Promote: open a PR setting \`newTag: ${{ github.sha }}\` in infra/k8s/kustomization.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
